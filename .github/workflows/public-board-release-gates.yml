#
# Source-only release gates for the two unanchored anonymous public-board
# endpoints. These gates are EXPECTED TO FAIL while issues #6/#12 are open.
# No dependencies, package installers, scripts from the Plane import,
# deployment targets, secrets, write permissions or network services required.
name: Public board release gates

on:
  pull_request:
    paths:
      - "acceptance/**"
      - "apps/api/plane/space/**"
      - ".github/workflows/public-board-release-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-board-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unanchored-public-routes:
    name: Fail closed on unanchored public-board routes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile bounded source-only release checks
        run: python3 -m compileall -q acceptance
      - name: Require public routes to be denied or publication-scoped
        run: python3 -m unittest discover -s acceptance -p pending_public_board_routes.py -v
