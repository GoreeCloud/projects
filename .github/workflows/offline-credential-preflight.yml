name: Offline tracked-source credential preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-credential-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile read-only source preflight
        run: python3 -m py_compile tests/test_tracked_import_credential_preflight.py
      - name: Scan tracked source without loading Plane or network services
        run: python3 -m unittest discover -s tests -p 'test_tracked_import_credential_preflight.py' -v
