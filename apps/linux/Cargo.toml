[package]
name = "goreecloud-projects-linux"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native Slint Linux client for GoreeCloud Projects"
rust-version = "1.88"

[dependencies]
slint = { version = "=1.14.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "std"] }
ureq = { version = "=2.12.1", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "=2.5.8"
